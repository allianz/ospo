# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — Repository Compliance Linting Configuration
#
# This file defines the standards every public repository in the Allianz GitHub
# organization must meet. The linter checks these rules automatically and opens
# a GitHub issue in any repository that does not comply.
#
# For more details, see the standards guide:
# https://cmp.allianz.net/spaces/ARGO/pages/2748785293/Mandatory+Repository+Configuration
#
# Parameters:
#   issue_title:      Title of the GitHub issue opened in non-compliant repositories.
#                     Also used as the lookup key — changing this breaks detection of
#                     previously opened issues.
#   docs_link:        URL inserted into the issue body as the standards guide link.
#   excluded_repos:   Repository names to skip entirely — no checks, no issues.
#   allowed_licenses: SPDX identifiers accepted by the license check. Must match
#                     the spdx_id returned by the GitHub API.
#   required_files:   Files every repository must contain.
#                     - pattern:      Case-insensitive prefix glob (e.g. README* matches README.md)
#                                     or a list of them, any of which may match
#                     - name:         Check name shown in issue body and output
#                     - search_paths: Directories to search (default: repo root only)
#                     - min_chars:    Minimum file size in characters (optional)
#                     - json_only:    true = reported in the compliance report only,
#                                     never listed in the issue (optional, default false)
#                     - why:          Why the file matters, shown in the issue below a
#                                     failure (required)
#   forbidden_files:  Files no repository may contain (e.g. organisation defaults that
#                     must not be overridden). pattern, name, search_paths and
#                     json_only and why as for required_files.
#   description_length: Minimum and maximum character length for repository descriptions.
#                     Descriptions outside this range fail the check.
#   allowed_topics:   Approved topic vocabulary. Every repository must have 1–5 topics,
#                     all from this list. An empty list disables the allowlist check.
#
# Want to propose a change? Open a pull request and describe your reasoning.

# ──────────────────────────────────────────────────────────────────────────────


# Title of the GitHub issue opened in non-compliant repositories.
# Change this only if you want to rename the issue across all future runs.
issue_title: "Mandatory Repository Configuration"
docs_link: "https://cmp.allianz.net/spaces/ARGO/pages/2748785293/Mandatory+Repository+Configuration"

# Repositories to exclude from linting entirely.
excluded_repos: [
  ".github",  # Special repository for GitHub configuration.
  "ng-aquila" # Custom MIT license. Needs clarification from legal.
]

# Minimum and maximum character length for repository descriptions.
# The description appears in the organisation repository list and in `gh repo view`.
description_length:
  min: 30
  max: 150

# Licenses repositories are allowed to use.
# The value must match the SPDX identifier shown on https://spdx.org/licenses/
# To permit an additional license, add its SPDX ID here and open a pull request.
allowed_licenses:
  - Apache-2.0
  - MIT
  - CC-BY-4.0
  - CC0-1.0

# Files that every repository must contain.
# - pattern: case-insensitive glob matched against filenames (e.g. README* matches README.md),
#            or a list of globs, any of which may match (the check ID comes from the first)
# - search_paths: directories to search (default: repo root only)
# - json_only: true = the file is only reported in the compliance report; no issue is opened for it
# - why: why the file matters, in plain words; shown in the issue below a failure (required)
# Adding a new entry here makes that file mandatory for all repositories.
required_files:
  - pattern: "README*"
    name: "Readme File"
    min_chars: 300
    why: "The README is the entry point of the project: what it does, how to use it and where to get help."
  - pattern: "CONTRIBUTING*"
    search_paths: [".", ".github", "docs"]
    name: "Contributing File"
    why: "It tells others how to propose changes and what is expected of a contribution."
  - pattern: "LICENSE*"
    name: "License File"
    why: "Without the license text nobody may legally use, change or share the code."
  - pattern: "NOTICE*"
    name: "Notice File"
    why: "It holds the copyright statement and the attribution for third-party code copied into the project, which most open source licenses require."
  - pattern: "AUTHORS*"
    name: "Authors File"
    why: 'It names the copyright holders that the copyright statement in the NOTICE file refers to ("The <Project> Authors"). This is a legal requirement.'
  - pattern: ["DEVELOPMENT*", "DEVELOPER*"]
    search_paths: [".", "docs", ".github"]
    name: "Development File"
    min_chars: 300
    why: "It shows how to build and test the project, so others can reproduce the build and check their changes before they propose them."
    json_only: true   # BSI TR-03185 BR.01: compliance report only, no issue

# Files a repository must not contain, because the organisation default from the
# .github repository applies to every repository that has no file of its own.
# GitHub uses a file of the repository in the root, .github or docs instead of the
# default, so all three are searched. Same fields as required_files (no min_chars).
forbidden_files:
  - pattern: "CODE_OF_CONDUCT*"
    search_paths: [".", ".github", "docs"]
    name: "Code of Conduct"
    why: "The [Allianz Code of Conduct](https://github.com/allianz/.github/blob/main/CODE_OF_CONDUCT.md) applies to all repositories, and GitHub shows it automatically. A file of your own would replace it."
  - pattern: "MAINTAINERS*"
    search_paths: [".", ".github", "docs"]
    name: "Maintainers File"
    why: "A MAINTAINERS file is easily confused with AUTHORS, the legally required list of copyright holders. It also puts the names of individuals into the repository, which is personal data under the GDPR."
  - pattern: "SECURITY*"
    search_paths: [".", ".github", "docs"]
    name: "Security Policy"
    why: "The [Allianz security policy](https://github.com/allianz/.github/blob/main/SECURITY.md) applies to all repositories, and GitHub shows it automatically. A file of your own would replace it. Add one only if the project has its own vulnerability reporting requirements."
    json_only: true   # SHOULD NOT (AZ.07): compliance report only, no issue

# Allowed topics for repositories. New topics can be suggested.
# Topics are used for filtering and organisation-wide statistics, so a controlled
# vocabulary prevents synonym drift (e.g. "k8s" vs "kubernetes").
# Every repository must have between 1 and 5 topics, all from this list.
allowed_topics:
  # Project type                                                                                                                   
  - api                                                                                                                            
  - cli                                                                                                                            
  - docs                                                                                                                           
  - iac                                                                       
  - library                                                                                                                        
  - mobile                                                                                                                         
  - sdk                                                                                                                            
  - service                                                                                                                        
  - template                                                                                                                       
  - web                                                                                                                            
  # Domain                                                                                                                         
  - ai                                                                                                                             
  - analytics                                                                                                                      
  - automation                                                                                                                     
  - batch                                                                                                                          
  - data                                                                                                                           
  - devops
  - network
  - security
  - streaming
  # Ecosystem — platform or framework the repository is built for or extends
  - angular
  - aws
  - azure
  - docker
  - github-actions
  - helm
  - kafka
  - kubernetes
  - terraform
