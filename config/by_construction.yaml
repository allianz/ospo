# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — By-Construction Checks Configuration
#
# This file configures the by_construction script. It writes the checks of
# guarantees GitHub gives by design (e.g. source archives generated from the
# tag, the SBOM of public repositories). They test nothing and always pass,
# one result per active repository, for the compliance report.
#
# Parameters:
#   excluded_repos:  Repository names to skip. Keep this empty: the compliance
#                    report counts a skipped repository as failing these checks.
#
# Want to propose a change? Open a pull request and describe your reasoning.

# ──────────────────────────────────────────────────────────────────────────────

excluded_repos: []
