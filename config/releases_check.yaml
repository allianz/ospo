# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — Releases Check Configuration
#
# This file configures the releases_check script. It reads the GitHub releases
# of every active repository and checks their version identifiers (SemVer or
# CalVer, increasing within each major line) and their release notes. JSON
# only: the script opens no issues and changes nothing on GitHub.
#
# Parameters:
#   excluded_repos:   Repository names to skip. Keep this empty: the compliance
#                     report counts a skipped repository as failing these checks.
#   lookback:         Releases published within this period are checked.
#                     Format: "<N> day(s)|month(s)|year(s)"
#   min_notes_chars:  Minimum length of a release body to count as release
#                     notes. A shorter body passes if CHANGELOG* in the
#                     repository root mentions the version.
#
# Want to propose a change? Open a pull request and describe your reasoning.

# ──────────────────────────────────────────────────────────────────────────────

excluded_repos: []

lookback: "12 months"

min_notes_chars: 50
