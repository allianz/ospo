# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — Compliance Report Configuration: BSI TR-03185 Chapter 2
#
# This file configures one report of the compliance_report script. It maps
# the checks of the tool files (out/*.json) to the requirements of BSI
# TR-03185 Chapter 2 and holds the requirement texts shown in the report.
# The requirement mapping exists only here: the checking scripts know
# nothing about requirement IDs. See scripts/spec/compliance_report_spec.md.
#
# Parameters:
#   key:          Prefix of the output files (bsi-data.json, …) and of the
#                 report ID (OSPO-CR-BSI-2026-11). Unique across all report
#                 configurations.
#   framework:    The requirement set (id, title, version, url, text_note,
#                 chapters), copied into data.json → framework.
#   inputs:       Tool files expected in the input directory, with the
#                 script that writes them.
#   notes:        Hand-written notes file (Key messages, Needs attention),
#                 relative to the repo root. Optional.
#   requirements: One entry per requirement: title, level (MUST, SHOULD,
#                 MAY), text (the clauses), implementation (plain text) and
#                 checks (check IDs). A MUST without checks is "Not met",
#                 a SHOULD or MAY without checks is "Not assessed".
#
# Every change goes through a pull request, which gives the audit trail.
# ──────────────────────────────────────────────────────────────────────────────

key: bsi

framework:
  id: bsi-tr-03185
  title: BSI TR-03185 Chapter 2
  version: 1.1.1
  url: https://www.bsi.bund.de/dok/TR-03185-en
  text_note: Short summary of each requirement, not a quotation.
  chapters:
    GV: Governance
    LE: Legal
    QA: Quality
    BR: Build and release
    VM: Vulnerability management
    DE: Decommissioning

inputs:
  - { file: lint_repos.json, script: scripts/lint_repos.js }
  - { file: license_scan.json, script: scripts/license_scan.js }
  - { file: archive_repos.json, script: scripts/archive_repos.js }
  - { file: by_construction.json, script: scripts/by_construction.js }
  - { file: advisories_check.json, script: scripts/advisories_check.js }
  - { file: releases_check.json, script: scripts/releases_check.js }
  - { file: scorecard.json, script: scripts/scorecard_check.js }

notes: config/compliance_report_bsi_notes.md

requirements:
  GV.01:
    title: How to contribute is documented
    level: MUST
    text:
      - { level: MUST, text: "Information on how to contribute to the project MUST be documented." }
      - { level: SHOULD, text: "Information about the expected quality of contributions SHOULD be given." }
    implementation: >-
      Every repository must contain a contribution guide (a CONTRIBUTING file in the root, .github or docs).
      A weekly check opens an issue in any repository that lacks one, until it is fixed.
    checks: [lint/contributing]

  GV.02:
    title: Protected against unauthorised actions
    level: MUST
    text:
      - { level: MUST, text: "The project's repository, websites and sensitive data MUST be protected against unauthorized actions." }
    implementation: >-
      Changes need a company account with single sign-on and multi-factor authentication; two-factor
      authentication is required for all members of the organisation. The base permission for members is
      none: only teams get access, team membership is synced from Entra ID, and members cannot create
      repositories. Every permission change is requested by pull request and approved first, and the
      provisioning pipeline applies it. An organisation-wide ruleset protects the default branches: pull
      request required, no force push, no deletion. Websites are published with GitHub Pages only, so the
      repository's access rules apply. Secret scanning and push protection are enabled for every repository
      through the organisation's security configuration.
    checks: [scorecard/branch-protection, scorecard/dangerous-workflow, scorecard/token-permissions]

  LE.01:
    title: License stated for all content
    level: MUST
    text:
      - { level: MUST, text: "A license MUST be stated for all content made available by the project, including the project's documentation." }
    implementation: >-
      Every repository must contain a license file with an approved license (Apache-2.0, MIT, CC-BY-4.0 or
      CC0-1.0). It covers all content of the repository, including its documentation and website, unless a
      file states otherwise. A weekly check opens an issue if the license is missing or not approved.
    checks: [lint/license-type]

  LE.02:
    title: Licenses of all components referenced
    level: MUST
    text:
      - { level: MUST, text: "A copy of all licenses in use, or references hereto, MUST be provided." }
    implementation: >-
      For every repository, a public SPDX SBOM is available from the dependency graph. It lists every
      declared dependency with its license identifier, which references the license text. The project's own
      license is covered by LE.01.
    checks: [by-construction/sbom-available]

  QA.01:
    title: List of third-party components available
    level: MUST
    text:
      - { level: MUST, text: "A list of third-party components used in the software MUST be available." }
    implementation: >-
      The dependency graph is enabled for every repository through the organisation's security
      configuration. Its SPDX SBOM is the public list of third-party components.
    checks: [by-construction/sbom-available]

  QA.02:
    title: Source code publicly readable
    level: MUST
    text:
      - { level: MUST, text: "All of the project's source code MUST be publicly readable." }
    implementation: >-
      All repositories are created as public by the provisioning pipeline. A weekly check confirms that
      every repository in scope is public.
    checks: [lint/public]

  QA.03:
    title: How to report defects is communicated
    level: MUST
    text:
      - { level: MUST, text: "The project MUST inform how to report defects." }
    implementation: >-
      Issues are enabled on every repository, and project teams cannot disable them. Security defects are
      reported privately (VM.01).
    checks: [lint/issues-enabled]

  QA.04:
    title: Testing procedures implemented and used
    level: MUST
    text:
      - { level: MUST, text: "Procedures for testing MUST be implemented and utilised." }
    implementation: >-
      Every repository with code tests its changes automatically in CI before pull requests are merged. A
      monthly check confirms that CI ran on recently merged pull requests.
    checks: [scorecard/ci-tests]

  QA.05:
    title: Memory safety issues reduced
    level: SHOULD
    text:
      - { level: SHOULD, text: "The project SHOULD take measures to reduce or avoid memory safety issues." }
    implementation: >-
      Projects use memory-safe languages. Projects with more than 5% code in C, C++, Objective-C or assembly
      are fuzzed, through OSS-Fuzz or ClusterFuzzLite. Code scanning (CodeQL) runs on every repository
      through the security configuration.
    checks: [scorecard/fuzzing]

  QA.06:
    title: Changes peer-reviewed
    level: SHOULD
    text:
      - { level: SHOULD, text: "All changes to the source code SHOULD be peer-reviewed." }
    implementation: >-
      The organisation-wide ruleset requires a pull request with at least one approval before merging into
      the default branch.
    checks: [scorecard/code-review]

  BR.01:
    title: Build information public
    level: MUST
    text:
      - { level: MUST, text: "Information on how to build all software assets MUST be publicly available." }
    implementation: >-
      Every repository contains DEVELOPMENT.md (in the root, docs or .github) describing how to build and
      test it. New repositories get a template.
    checks: [lint/development]

  BR.02:
    title: Unique, increasing version identifiers
    level: MUST
    text:
      - { level: MUST, text: "All releases and released software assets intended for use MUST be assigned unique, monotonically increasing version identifiers." }
    implementation: >-
      Releases are tagged with SemVer or CalVer. Tags are unique by construction in git. A monthly check
      confirms that versions increase within each major version line.
    checks: [releases/versioning]

  BR.03:
    title: Integrity of distributed assets verifiable
    level: MUST
    text:
      - { level: MUST, text: "All assets MUST be distributed in a way that maintains integrity or at least allows its verification." }
      - { level: MAY, text: "Means to maintain and verify authenticity MAY be deployed." }
    implementation: >-
      GitHub generates source archives from the tag and serves them over HTTPS. Release assets are built by
      the OSPO release workflow template, which adds SHA-256 checksums and a signed artifact attestation.
    checks: [scorecard/signed-releases]

  BR.04:
    title: Change log per release
    level: MUST
    text:
      - { level: MUST, text: "All releases MUST provide a descriptive log of functional and security modifications." }
    implementation: >-
      Every GitHub release has release notes. The release template enables generated release notes, grouped
      by labels such as security.
    checks: [releases/release-notes]

  BR.05:
    title: Source packages match the repository
    level: MUST
    text:
      - { level: MUST, text: "Released source packages MUST NOT contain any content that is not present in the project's repository or cannot be deterministically generated from it." }
    implementation: >-
      Source packages are the archives GitHub generates from the tag, so they contain exactly the repository
      content. Built packages are produced by the release workflow from the tagged commit, and the artifact
      attestation (BR.03) links each asset to that commit.
    checks: [by-construction/source-archives]

  BR.06:
    title: Builds reproducible
    level: SHOULD
    text:
      - { level: SHOULD, text: "Builds SHOULD be reproducible." }
    implementation: >-
      No measure across the portfolio yet. Reproducible builds cannot be verified at this scale; the
      requirement is reassessed once BR.03 is met.
    checks: []

  VM.01:
    title: Security contact and private reporting
    level: MUST
    text:
      - { level: MUST, text: "The project documentation MUST contain security contacts for reporting vulnerabilities." }
      - { level: SHOULD, text: "There SHOULD be a way to do so privately." }
    implementation: >-
      An organisation-wide security policy applies to every repository without its own. It names the OSPO as
      security contact and asks reporters to use private vulnerability reporting, which is enabled on every
      repository.
    checks: [scorecard/security-policy]

  VM.02:
    title: Vulnerabilities published in reasonable time
    level: MUST
    text:
      - { level: MUST, text: "The project MUST publish information about discovered vulnerabilities within a reasonable period of time." }
    implementation: >-
      Privately reported vulnerabilities are triaged by the project team and the OSPO and published as a
      GitHub Security Advisory with a CVE, within 90 days of the report.
    checks: [advisories/published-in-time]

  DE.01:
    title: Discontinuation communicated
    level: SHOULD
    text:
      - { level: SHOULD, text: "Discontinuation of the project, parts of it, or specific versions or version ranges SHOULD be communicated adequately." }
    implementation: >-
      Every active repository is checked for activity in each weekly run. Repositories without activity for
      12 months get a public notice issue. After 60 more days without activity they are archived and leave
      the scope. The notice stays visible, and GitHub marks the repository as archived and read-only.
    checks: [archive/activity-checked]

  DE.02:
    title: Migration paths outlined
    level: MAY
    text:
      - { level: MAY, text: "If the project, parts of it, or specific versions are discontinued, migration paths MAY be outlined, for example by naming a successor project or a maintained alternative and describing how users can move to it." }
    implementation: >-
      Currently not done. We will revisit this requirement once the open source programme is more mature.
    checks: []
