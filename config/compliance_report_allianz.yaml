# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — Compliance Report Configuration: Allianz Mandatory Repository
# Configuration
#
# This file configures one report of the compliance_report script. It maps
# the checks of the tool files (results/*.json) to the rules of the Allianz
# guideline "Mandatory Repository Configuration" and holds the rule texts
# shown in the report. Rules that are enforced by organisation settings are
# not part of this report. The requirement mapping exists only here: the
# checking scripts know nothing about requirement IDs. See
# scripts/spec/compliance_report_spec.md.
#
# Parameters:
#   key:          Prefix of the output files (allianz-data.json, …) and of the
#                 report ID (OSPO-CR-ALLIANZ-2026-11). Unique across all
#                 report configurations.
#   framework:    The requirement set (id, title, version, url, text_note,
#                 chapters), copied into data.json → framework.
#   inputs:       Tool files expected in the input directory, with the
#                 script that writes them.
#   notes:        Hand-written notes file (Key messages, Needs attention),
#                 relative to the repo root. Optional.
#   out_of_scope: Repositories this report does not cover at all, each with
#                 repo and reason. They are dropped like archived ones and
#                 listed with the reason in appendix A. Optional. Unlike a
#                 tool's excluded_repos (counted as failing), this is a
#                 decision of the report: give the reason.
#   requirements: One entry per requirement: title, level (MUST, SHOULD,
#                 MAY), text (the clauses), implementation (plain text) and
#                 checks (check IDs). A MUST without checks is "Not met",
#                 a SHOULD or MAY without checks is "Not assessed".
#
# The rule values (lengths, topics, licenses) must match config/lint_repos.yaml,
# which is the source of truth for the guideline page.
#
# Every change goes through a pull request, which gives the audit trail.
# ──────────────────────────────────────────────────────────────────────────────

key: allianz

framework:
  id: allianz-mandatory-repo-config
  title: Allianz Mandatory Repository Configuration
  version: "2026-06-11"
  url: https://cmp.allianz.net/spaces/ARGO/pages/2748785293/Mandatory+Repository+Configuration
  text_note: Summary of each rule of the guideline page.
  chapters:
    RC: Repository configuration

inputs:
  - { file: lint_repos.json, script: scripts/lint_repos.js }

notes: config/compliance_report_allianz_notes.md

out_of_scope:
  - { repo: .github, reason: "Organisation configuration (profile, default community files), not a project" }

requirements:
  RC.01:
    title: Description set
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST have a one-line description of 30 to 150 characters (the metadata field shown in the organisation list and in `gh repo view`, not the README)." }
    implementation: >-
      The OSPO linting bot checks the description of every repository twice a week and opens the issue
      "Mandatory Repository Configuration" in any repository whose description is missing, too short or too
      long, until it is fixed.
    checks: [lint/description]

  RC.02:
    title: Topics from the approved list
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST have 1 to 5 topics, all from the approved list (e.g. api, cli, iac, library, service, ai, data, devops, aws, terraform)." }
    implementation: >-
      The approved list is the allowed_topics list of the linting configuration. The linting bot checks the
      topics twice a week and opens the issue "Mandatory Repository Configuration" until they comply.
    checks: [lint/topics]

  RC.03:
    title: Approved license
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST contain a LICENSE file in the root with one of the licenses Apache-2.0, MIT, CC-BY-4.0 or CC0-1.0." }
    implementation: >-
      The linting bot checks that a LICENSE file exists in the root and that the license GitHub detects is
      one of the approved licenses. It opens the issue "Mandatory Repository Configuration" until both
      checks pass.
    checks: [lint/license, lint/license-type]

  RC.04:
    title: README present
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST contain a README file in the root with at least 300 characters." }
    implementation: >-
      The linting bot checks the README in the root and its length twice a week and opens the issue
      "Mandatory Repository Configuration" until it is fixed.
    checks: [lint/readme]

  RC.05:
    title: CONTRIBUTING present
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST contain a CONTRIBUTING file explaining how to propose changes." }
    implementation: >-
      The linting bot looks for a CONTRIBUTING file in the root, .github or docs twice a week and opens the
      issue "Mandatory Repository Configuration" until one exists.
    checks: [lint/contributing]

  RC.06:
    title: NOTICE present
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST contain a NOTICE file in the root, with the attribution for third-party source code copied into the project." }
    implementation: >-
      The linting bot checks for a NOTICE file in the root twice a week and opens the issue "Mandatory
      Repository Configuration" until one exists. Its format follows the Allianz NOTICE File format guide.
    checks: [lint/notice]

  RC.07:
    title: AUTHORS present
    level: MUST
    text:
      - { level: MUST, text: "The repository MUST contain an AUTHORS file in the root listing the project contributors." }
    implementation: >-
      The linting bot checks for an AUTHORS file in the root twice a week and opens the issue "Mandatory
      Repository Configuration" until one exists. Its format follows the Allianz AUTHORS File format guide.
    checks: [lint/authors]
