# ──────────────────────────────────────────────────────────────────────────────
# Allianz OSPO — Security Advisories Check Configuration
#
# This file configures the advisories_check script. It reads the published
# security advisories of every active repository and checks that each was
# published in reasonable time after its creation. JSON only: the script opens
# no issues and changes nothing on GitHub.
#
# Parameters:
#   excluded_repos:  Repository names to skip. Keep this empty: the compliance
#                    report counts a skipped repository as failing this check.
#   max_days:        Maximum days from creation to publication of an advisory.
#   lookback:        Advisories published within this period are checked.
#                    Format: "<N> day(s)|month(s)|year(s)"
#
# Want to propose a change? Open a pull request and describe your reasoning.

# ──────────────────────────────────────────────────────────────────────────────

excluded_repos: []

max_days: 90

lookback: "12 months"
