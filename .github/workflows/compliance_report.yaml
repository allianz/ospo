---
# Monthly compliance report (scripts/spec/compliance_implementation_draft.md, section 1.4).
# Runs `make create_reports` (all tools with --dry-run, so nothing is written to GitHub except the
# report branch), commits reports/<YYYY-MM>/ to the branch compliance-report and opens a pull request.
# The OSPO reviews it, edits the notes files on the branch (which reruns this workflow) and merges.
name: Compliance report
on:
  workflow_dispatch: null
  schedule:
    - cron: '0 3 1 * *'
  pull_request:
    paths: ['config/report/compliance_report_*_notes.md']

permissions:
  contents: read

concurrency:
  group: compliance-report
  cancel-in-progress: false

env:
  BRANCH: compliance-report
  SCORECARD_VERSION: 5.6.0
  SCORECARD_SHA256: 19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a

jobs:
  report:
    # pull_request: only the report PR of this repository, never other PRs or forks
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'compliance-report' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.ALLIANZ_APP_ID }}
          private-key: ${{ secrets.ALLIANZ_APP_PRIVATE_KEY }}
          owner: allianz

      # The App token is persisted for the push, so the push triggers the checks of the pull request
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Reuse the report branch (it keeps the notes edits of the open PR) and bring in main:
      # the current scripts and the merged reports, which carry the history
      - name: Switch to the report branch
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit origin/main; then
              echo "::error::Could not merge main into $BRANCH. Update the branch by hand, then rerun."
              exit 1
            fi
          else
            git checkout -b "$BRANCH" origin/main
          fi

      # On pull_request the path filter applies to the whole PR diff, so this workflow's own push
      # (reports/ only) would trigger it again. Run only if the head commit changes something else.
      - name: Check trigger
        id: trigger
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^ HEAD | grep -qv '^reports/'; then
            echo "Head commit changes only reports/: nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.trigger.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26'

      - name: Install dependencies
        if: steps.trigger.outputs.run == 'true'
        run: npm ci
        working-directory: scripts

      # Saved by lint_repos.yaml; only restored here
      - name: Restore lint cache
        if: steps.trigger.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lint_cache/
          key: lint-cache-allianz

      # Pinned version and checksum; scorecard_check also fails on any other version (scorecard_version in its config)
      - name: Install Scorecard CLI
        if: steps.trigger.outputs.run == 'true'
        run: |
          dir="$RUNNER_TEMP/scorecard"
          archive="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/$archive" "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${archive}"
          echo "${SCORECARD_SHA256}  $dir/$archive" | sha256sum --check
          tar -xzf "$dir/$archive" -C "$dir" scorecard
          echo "$dir" >> "$GITHUB_PATH"

      # GITHUB_SHA is set to the checked-out commit: on pull_request the event SHA is the merge ref,
      # and after the merge above HEAD is a new commit. Both are pushed below.
      - name: Create reports
        id: reports
        if: steps.trigger.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          # Next to results/, not in it: make create_reports empties results/ first. Uploaded below, also on failure.
          log=create_reports.log
          GITHUB_SHA=$(git rev-parse HEAD) make create_reports 2>&1 | tee "$log"
          # compliance_report's own warnings (missing or invalid tool files, tool errors) as annotations
          sed -n 's/^Warning: /::warning::/p' "$log"
          summary="$RUNNER_TEMP/summary.md"
          {
            echo '### Compliance report'
            echo '```'
            sed -n '/^Report: /,/^HTML written/p' "$log"
            echo '```'
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      # The tool files are not committed; they are kept here, together with the reports and the log
      - name: Upload reports and tool files
        if: always() && steps.trigger.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-report-${{ steps.reports.outputs.month }}
          path: |
            create_reports.log
            results/
            reports/${{ steps.reports.outputs.month }}/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit and push
        if: steps.trigger.outputs.run == 'true'
        env:
          MONTH: ${{ steps.reports.outputs.month }}
        run: |
          git add reports/
          if git diff --cached --quiet; then
            echo "Reports unchanged."
          else
            git commit -m "Compliance report $MONTH"
          fi
          git push origin "$BRANCH"

      - name: Open pull request
        if: steps.trigger.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MONTH: ${{ steps.reports.outputs.month }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = 0 ]; then
            echo "The branch has no commits ahead of main: no pull request."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Pull request already open: the push above added the new report to it."
            exit 0
          fi
          body="$RUNNER_TEMP/pr_body.md"
          {
            echo "Monthly compliance report for $MONTH, created by [this workflow run]($RUN_URL)."
            echo
            echo "- **View:** download the artifact \`compliance-report-$MONTH\` of the run, or the \`*-report.html\` files of \`reports/$MONTH/\` from this branch, and open them in a browser."
            echo "- **Notes:** edit \`config/report/compliance_report_*_notes.md\` on this branch (Key messages, Needs attention). Each edit reruns all tools and updates the reports."
            echo "- **Publish:** merge. The merged \`reports/$MONTH/\` is the published report and the base of next month's trend."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$body"
          gh pr create --base main --head "$BRANCH" --title "Compliance report $MONTH" --body-file "$body"
